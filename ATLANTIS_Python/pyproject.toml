[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantis-python"
version = "0.2.4"
description = "Python migration of ATLANTIS Attractor Landscape Analysis Toolbox"
requires-python = ">=3.12,<3.14"
license = {text = "GPL-3.0-or-later"}
dependencies = ["z3-solver==5.4.1.0", "numpy==2.5.4", "scipy==1.18.1", "matplotlib==3.11.2", "networkx==3.7", "PySide6-Essentials==6.12.0", "h5py==3.16.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
quantum = ["qiskit==2.6.2", "qiskit-aer==0.18.2", "qiskit-ibm-runtime==0.51.0", "psutil==7.2.2"]

[project.scripts]
atlantis = "atlantis.gui:main"
atlantis-cli = "atlantis.cli:main"

[tool.setuptools.packages.find]
include = ["atlantis*"]

[tool.setuptools.package-data]
atlantis = ["assets/guide/*.json", "assets/images/Active/*.jpg", "assets/images/Inactive/*.jpg", "assets/images/*.jpg", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
